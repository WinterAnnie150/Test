name: Verify Temurin 8 Download

on:
  workflow_dispatch:

jobs:
  verify-download:
    runs-on: windows-2022
    steps:
      - name: Download and inspect Temurin 8 ZIP
        shell: pwsh
        run: |
          $url = "https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u512-b09/OpenJDK8U-jdk_x64_windows_hotspot_8u512b09.zip"
          $outFile = "$env:TEMP\OpenJDK8U-jdk_x64_windows_hotspot_8u512b09.zip"
          $expectedHash = "20f248ddd600f900cd9b235d50d54cdb27e7b750f140d381176a7612c53663cd"

          Write-Host "Testing URL: $url"
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          try {
            $response = Invoke-WebRequest -Uri $url -OutFile $outFile -PassThru -UseBasicParsing
            $sw.Stop()
            Write-Host "HTTP Status: $($response.StatusCode)"
            Write-Host "Content-Type: $($response.Headers['Content-Type'])"
            Write-Host "Download Time: $($sw.Elapsed.TotalSeconds) seconds"
          } catch {
            $sw.Stop()
            Write-Error "Download failed after $($sw.Elapsed.TotalSeconds)s: $_"
            exit 1
          }

          $fileInfo = Get-Item $outFile
          Write-Host "Downloaded File Size: $($fileInfo.Length) bytes"

          $actualHash = (Get-FileHash -Path $outFile -Algorithm SHA256).Hash
          Write-Host "Expected SHA256: $expectedHash"
          Write-Host "Actual   SHA256: $actualHash"

          # Check magic bytes (valid ZIP starts with 'PK' -> 0x50 0x4B)
          $bytes = Get-Content -Path $outFile -Encoding Byte -TotalCount 4
          $magic = ($bytes | ForEach-Object { $_.ToString("X2") }) -join " "
          Write-Host "First 4 bytes (Hex): $magic"

          if ($magic -notmatch "^50 4B") {
            Write-Warning "File is NOT a valid ZIP archive! Previewing first 20 lines:"
            Get-Content -Path $outFile -TotalCount 20
            exit 1
          }

          if ($actualHash -ne $expectedHash) {
            Write-Error "Checksum mismatch!"
            exit 1
          }

          Write-Host "SUCCESS: Valid ZIP archive and matching SHA-256 checksum."
